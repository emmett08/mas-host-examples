version = "mas-agents/3"
[connections.study]
kind = "openai"
api_key_env = "OPENAI_API_KEY"
[[agents]]
name = "diagnose"
operation = "incident_diagnosis/1"
output_schema = "schemas/candidate.json"
[agents.implementation]
kind = "llm"
connection = "study"
model = "gpt-5.4-mini-2026-03-17"
instructions = "prompts/diagnose.md"
max_output_tokens = 2048
[[agents]]
name = "critic"
operation = "incident_critique/1"
output_schema = "schemas/critique.json"
[agents.implementation]
kind = "llm"
connection = "study"
model = "gpt-5.4-mini-2026-03-17"
instructions = "prompts/critic.md"
max_output_tokens = 2048
[limits]
wall_seconds = 180
max_calls = 4
max_messages = 32
max_bytes = 65536
mailbox_capacity = 8
