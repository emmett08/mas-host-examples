name: Kubernetes live MAS demonstration

on:
  pull_request:
    paths: ['examples/k3s-live/**', '.github/workflows/k3s-demo.yml', 'host-revision.txt']
  push:
    branches: [main]
    paths: ['examples/k3s-live/**', '.github/workflows/k3s-demo.yml', 'host-revision.txt']
  workflow_dispatch:
    inputs:
      deploy_live:
        description: 'Create k3s on this GitHub runner and record a real LLM investigation'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: k3s-demo-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ephemeral-k3s:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      image-id: ${{ steps.build-image.outputs.image-id }}
      image-artifact-id: ${{ steps.share-image.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/k3s-live/package-lock.json
      - name: Type checks, application build and controller tests
        working-directory: examples/k3s-live
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build
      - name: Verify the finite hybrid choreography using SPIN
        run: |
          sudo apt-get update
          sudo apt-get install -y spin
          python3 examples/k3s-live/verification/verify.py
      - name: Build dashboard, agents and observer image
        id: build-image
        run: |
          docker build -f examples/k3s-live/Dockerfile -t mas-k3s-live:demo .
          echo "image-id=$(docker image inspect --format '{{.Id}}' mas-k3s-live:demo)" >> "$GITHUB_OUTPUT"
          docker image inspect --format 'Image {{.Id}}, size {{.Size}} bytes' mas-k3s-live:demo
      - name: Install pinned k3d
        env:
          K3D_VERSION: v5.8.3
        run: |
          curl --fail --location --silent --show-error "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64" -o /tmp/k3d
          sudo install -m 0755 /tmp/k3d /usr/local/bin/k3d
          k3d version
      - name: Create ephemeral k3s cluster and import image
        run: |
          set -euo pipefail
          k3d cluster create mas-demo --image rancher/k3s:v1.32.3-k3s1 --wait --timeout 120s
          # Avoid the shared tools-node tarball; verify the actual node image store.
          k3d image import mas-k3s-live:demo --cluster mas-demo --mode direct
          docker exec k3d-mas-demo-server-0 ctr --address /run/k3s/containerd/containerd.sock --namespace k8s.io images list --quiet |
            grep --fixed-strings --line-regexp 'docker.io/library/mas-k3s-live:demo'
          kubectl config use-context k3d-mas-demo
          kubectl -n kube-system wait --for=condition=Available deployment/metrics-server --timeout=180s
      - name: Deploy and exercise event-driven controller with credential-free provider fixture
        env:
          DEMO_MODE: fixture
          SHOW_PAYLOADS: 'true'
          DEMO_AUTO_REMEDIATE: 'true'
        run: |
          examples/k3s-live/deploy/apply.sh
          examples/k3s-live/deploy/smoke.sh
      - name: Install browser for the canvas recording
        working-directory: examples/k3s-live
        run: npx playwright install --with-deps chromium
      - name: Enable paced fixture providers for observable canvas recording
        run: |
          kubectl -n mas-demo set env deployment/mas-demo --containers=dashboard DEMO_FIXTURE_RECORDING=true
          kubectl -n mas-demo rollout status deployment/mas-demo --timeout=180s
      - name: Record the actual canvas while another event-driven fixture run executes
        env:
          DEMO_MODE: fixture
          DEMO_FIXTURE_RECORDING: 'true'
          DEMO_ARTIFACT_DIR: ${{ runner.temp }}/mas-demo-artifacts
        run: node examples/k3s-live/deploy/record-demo.mjs
      - name: Package the same Vue dashboard with captured fixture observations
        if: always()
        working-directory: examples/k3s-live
        run: npm run archive -- "${{ runner.temp }}/mas-demo-artifacts"
      - name: Verify the downloaded dashboard opens offline and plays its observations
        if: always()
        working-directory: examples/k3s-live
        run: node deploy/check-archive.mjs "${{ runner.temp }}/mas-demo-artifacts"
      - name: Export the fixture-tested image for the live job
        if: success() && github.event_name == 'workflow_dispatch' && inputs.deploy_live && github.ref == 'refs/heads/main'
        run: docker image save mas-k3s-live:demo --output "$RUNNER_TEMP/mas-k3s-image.tar"
      - name: Retain the fixture-tested image for this workflow attempt
        id: share-image
        if: success() && github.event_name == 'workflow_dispatch' && inputs.deploy_live && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mas-k3s-image-${{ github.run_id }}
          overwrite: true
          path: ${{ runner.temp }}/mas-k3s-image.tar
          compression-level: 1
          retention-days: 7
          if-no-files-found: error
      - name: Retain fixture canvas recording and trace
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mas-k3s-fixture-${{ github.run_id }}
          path: ${{ runner.temp }}/mas-demo-artifacts
          retention-days: 7
          if-no-files-found: warn
      - name: Capture diagnostics
        if: failure()
        run: |
          kubectl -n mas-demo get pods,events,masdemoruns,masremediations -o wide || true
          kubectl -n mas-demo logs deployment/mas-demo -c dashboard --tail=100 || true
          kubectl -n mas-demo logs deployment/mas-demo -c operator --tail=100 || true
          kubectl -n mas-demo logs deployment/mas-demo-remediator --tail=100 || true
      - name: Remove ephemeral cluster
        if: always()
        run: k3d cluster delete mas-demo || true

  live-k3s:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_live && github.ref == 'refs/heads/main'
    needs: ephemeral-k3s
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The only user-supplied credential is this environment's OPENAI_API_KEY.
    environment: mas-k3s-demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check live provider configuration before preparing the cluster
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo '::error::Add OPENAI_API_KEY to the mas-k3s-demo environment in this repository.'
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/k3s-live/package-lock.json
      - name: Install recording tools
        working-directory: examples/k3s-live
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Download the image that passed the fixture job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.ephemeral-k3s.outputs.image-artifact-id }}
          path: ${{ runner.temp }}/fixture-image
          merge-multiple: true
          digest-mismatch: error
      - name: Load and verify the fixture-tested image
        env:
          EXPECTED_IMAGE_ID: ${{ needs.ephemeral-k3s.outputs.image-id }}
        run: |
          docker image load --input "$RUNNER_TEMP/fixture-image/mas-k3s-image.tar"
          test "$(docker image inspect --format '{{.Id}}' mas-k3s-live:demo)" = "$EXPECTED_IMAGE_ID"
      - name: Install pinned k3d
        env:
          K3D_VERSION: v5.8.3
        run: |
          curl --fail --location --silent --show-error "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64" -o /tmp/k3d
          sudo install -m 0755 /tmp/k3d /usr/local/bin/k3d
          k3d version
      - name: Create the runner-local k3s cluster and its kubeconfig
        run: |
          set -euo pipefail
          k3d cluster create mas-demo --image rancher/k3s:v1.32.3-k3s1 --wait --timeout 120s
          # Avoid the shared tools-node tarball; verify the actual node image store.
          k3d image import mas-k3s-live:demo --cluster mas-demo --mode direct
          docker exec k3d-mas-demo-server-0 ctr --address /run/k3s/containerd/containerd.sock --namespace k8s.io images list --quiet |
            grep --fixed-strings --line-regexp 'docker.io/library/mas-k3s-live:demo'
          kubectl config use-context k3d-mas-demo
          kubectl get nodes
          kubectl -n kube-system wait --for=condition=Available deployment/metrics-server --timeout=180s
      - name: Deploy real LLM agents inside the runner's cluster
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEMO_MODE: live
          SHOW_PAYLOADS: 'true'
          DEMO_AUTO_REMEDIATE: 'true'
        run: examples/k3s-live/deploy/apply.sh
      - name: Record the live canvas and retain the actual result
        env:
          DEMO_MODE: live
          DEMO_ARTIFACT_DIR: ${{ runner.temp }}/mas-demo-artifacts
        run: node examples/k3s-live/deploy/record-demo.mjs
      - name: Package the same Vue dashboard with captured live observations
        if: always()
        working-directory: examples/k3s-live
        run: npm run archive -- "${{ runner.temp }}/mas-demo-artifacts"
      - name: Verify the downloaded dashboard opens offline and plays its observations
        if: always()
        working-directory: examples/k3s-live
        run: node deploy/check-archive.mjs "${{ runner.temp }}/mas-demo-artifacts"
      - name: Retain live canvas recording and trace
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mas-k3s-live-${{ github.run_id }}
          path: ${{ runner.temp }}/mas-demo-artifacts
          retention-days: 7
          if-no-files-found: warn
      - name: Capture cluster diagnostics
        if: failure()
        run: |
          kubectl -n mas-demo get pods,events,masdemoruns,masremediations -o wide || true
          kubectl -n mas-demo logs deployment/mas-demo -c dashboard --tail=100 || true
          kubectl -n mas-demo logs deployment/mas-demo -c operator --tail=100 || true
          kubectl -n mas-demo logs deployment/mas-demo-remediator --tail=100 || true
      - name: Remove the runner-local cluster
        if: always()
        run: k3d cluster delete mas-demo || true
