name: Bounded source self-healing

on:
  pull_request:
    paths: ['examples/self-healing/**', '.github/workflows/self-healing.yml', '.github/workflows/self-healing-case.yml', '.github/actions/prepared-mas-host/**', '.github/actions/self-healing-integration/**', 'host-revision.txt', 'mcp-revision.txt', 'scripts/setup-mcp.sh', 'scripts/setup.sh', 'Makefile']
  push:
    branches: [main]
    paths: ['examples/self-healing/**', '.github/workflows/self-healing.yml', '.github/workflows/self-healing-case.yml', '.github/actions/prepared-mas-host/**', '.github/actions/self-healing-integration/**', 'host-revision.txt', 'mcp-revision.txt', 'scripts/setup-mcp.sh', 'scripts/setup.sh', 'Makefile']
  workflow_dispatch:
    inputs:
      live_provider:
        description: 'Use a billed provider after all credential-free checks pass'
        type: boolean
        default: false
      all_cases:
        description: 'Run all eight cases (live mode: up to 96 calls and USD 16 reserved in total)'
        type: boolean
        default: false
      case:
        description: 'Selected case when Run all cases is unchecked'
        type: choice
        default: missing-route
        options: [missing-route, business-logic, runtime-config, held-out-combination, unavailable-dependency, ambiguous-requirement, no-defect, verification-bypass]
      publication:
        description: 'Publish only into the explicitly scoped disposable demonstration branch'
        type: choice
        default: archive
        options: [archive, pull-request, automatic]

permissions:
  contents: read

# A push to demo/incidents/** or a repair branch cannot trigger this workflow.
# A repair PR targets demo/incidents/** and cannot obtain live credentials.
concurrency:
  group: self-remediation-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24.19.0'
  # Per-case limits. All eight live cases reserve at most 96 calls and USD 16.
  # Fixture controls and publication/promotion make no provider calls.
  MAS_HOST_BUILD_PROFILE: release
  MAS_HOST_BIN: ${{ github.workspace }}/.tools/mas-host/target/release/mas-host
  MAS_SDK_ROOT: ${{ github.workspace }}/.tools/mas-host
  SELF_REMEDIATION_MAX_CALLS: '12'
  SELF_REMEDIATION_MAX_CANDIDATES: '3'
  SELF_REMEDIATION_MAX_SECONDS: '600'
  SELF_REMEDIATION_MAX_USD: '2.00'

jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      host-artifact-id: ${{ steps.share-host.outputs.artifact-id }}
      host-sha256: ${{ steps.pack-host.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: examples/self-healing/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.24.0'
          cache: false
      - name: Install formal checker and exact host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y spin
          rustup toolchain install 1.99.0 --profile minimal
      - name: Compile the pinned host, not host main
        run: make setup
      - name: Compile the independently pinned MCP server
        run: bash scripts/setup-mcp.sh
      - name: Build the separate application and observer bundle
        working-directory: examples/self-healing
        env:
          SELF_REMEDIATION_OBSERVER_LIVE: 'false'
          SELF_REMEDIATION_OBSERVER_CASE: missing-route
        run: |
          npm ci --ignore-scripts
          npm run build
          npm test
      - name: Make the built local observer available before the live job starts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: self-remediation-observer-${{ github.run_id }}-${{ github.run_attempt }}
          path: examples/self-healing/dist/observer
          if-no-files-found: error
          retention-days: 14
      - name: Compile host topology and exercise native and custom MCP contracts
        working-directory: examples/self-healing
        env:
          MAS_HOST_BIN: ${{ github.workspace }}/.tools/mas-host/target/release/mas-host
          MAS_SDK_ROOT: ${{ github.workspace }}/.tools/mas-host
        run: |
          npm run test:host
          npm run test:mcp
      - name: Verify during-run browser updates, mobile layout and offline seeking
        working-directory: examples/self-healing
        env:
          SELF_REMEDIATION_BROWSER_TEST: '1'
        run: |
          npx playwright install --with-deps chromium
          node --import tsx --test tests/observer-browser.test.ts
      - name: Exhaust finite controller invariants and guard-removal controls
        run: python3 examples/self-healing/verification/verify.py --out "$RUNNER_TEMP/self-remediation-formal"
      - name: Build the credential-free candidate execution image
        run: |
          docker build -t mas-self-remediation-builder examples/self-healing/sandbox
          echo "MAS_SANDBOX_IMAGE=$(docker image inspect --format '{{.Id}}' mas-self-remediation-builder)" >> "$GITHUB_ENV"
      - name: Create isolated runner-local k3s
        run: bash examples/self-healing/scripts/prepare-k3s.sh
      - name: Real host, generated fixture patch, independent checks and k3s trial
        uses: ./.github/actions/self-healing-integration
        with:
          mode: fixture
          case: missing-route
          output: ${{ runner.temp }}/self-remediation-fixture
        env:
          MAS_HOST_BIN: ${{ github.workspace }}/.tools/mas-host/target/release/mas-host
          MAS_SDK_ROOT: ${{ github.workspace }}/.tools/mas-host
      - name: Full isolated repair through the official MCP client
        working-directory: examples/self-healing
        env:
          MAS_HOST_BIN: ${{ github.workspace }}/.tools/mas-host/target/release/mas-host
          MAS_SDK_ROOT: ${{ github.workspace }}/.tools/mas-host
        run: npm run demo:mcp -- --output "$RUNNER_TEMP/self-healing-mcp" --incident mcp-fixture
      - name: Retain diagnostics, checkpoint receipts and offline observer
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: self-remediation-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/self-remediation-fixture
            !${{ runner.temp }}/self-remediation-fixture/durable-checkpoints/**
            ${{ runner.temp }}/self-remediation-formal
            ${{ runner.temp }}/self-healing-mcp/incident
            ${{ runner.temp }}/self-healing-mcp/observations.json
          if-no-files-found: warn
          retention-days: 14
      - name: Retain desktop and mobile browser control evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: self-remediation-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/self-remediation-observer-*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Package the tested release host and SDK for all selected cases
        id: pack-host
        run: |
          tar -cf "$RUNNER_TEMP/self-healing-host.tar" --exclude='./target' -C .tools/mas-host .
          tar -rf "$RUNNER_TEMP/self-healing-host.tar" -C .tools/mas-host target/release/mas-host
          gzip "$RUNNER_TEMP/self-healing-host.tar"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/self-healing-host.tar.gz" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Retain outer MCP task, prepared contracts and the tested host
        id: share-host
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: self-healing-mcp-gateway-${{ github.run_id }}-${{ github.run_attempt }}
          # These fixture records contain credential names, never credential values.
          # Restrict project retention to metadata and the bundle, excluding executable copies.
          # The tested host shares this upload to stay within ten artifacts/job,
          # including six recovery checkpoints, observer, diagnostics and browser evidence.
          path: |
            ${{ runner.temp }}/self-healing-host.tar.gz
            ${{ runner.temp }}/self-healing-mcp/state
            ${{ runner.temp }}/self-healing-mcp/server.json
            ${{ runner.temp }}/self-healing-mcp/request.json
            ${{ runner.temp }}/self-healing-mcp/mcp-client.json
            ${{ runner.temp }}/self-healing-mcp/project/*.json
            ${{ runner.temp }}/self-healing-mcp/project/.mas/build/bundle.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve cluster observations and remove disposable cluster
        if: always()
        run: |
          kubectl get pods,events --all-namespaces -o wide || true
          k3d cluster delete self-remediation || true


  examples:
    if: github.event_name == 'workflow_dispatch' && (inputs.all_cases || inputs.live_provider || inputs.case != 'missing-route') && (!inputs.live_provider || github.ref == 'refs/heads/main')
    needs: fixture
    permissions:
      contents: read
      actions: read
      checks: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case: ${{ fromJSON(inputs.all_cases && '["missing-route","business-logic","runtime-config","held-out-combination","unavailable-dependency","ambiguous-requirement","no-defect","verification-bypass"]' || format('["{0}"]', inputs.case || 'missing-route')) }}
    uses: ./.github/workflows/self-healing-case.yml
    with:
      case: ${{ matrix.case }}
      live_provider: ${{ inputs.live_provider }}
      publication: ${{ inputs.publication }}
      host_artifact_id: ${{ needs.fixture.outputs.host-artifact-id }}
      host_sha256: ${{ needs.fixture.outputs.host-sha256 }}
