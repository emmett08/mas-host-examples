name: Application examples

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: examples-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  applications:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.24.0'
          cache: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Build pinned host from its independent repository
        run: make setup
      - name: Application checks and real host acceptance
        run: make verify
      - name: Run documented commands
        run: make go rust cpp python python-client command star tree mesh composed

  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.24.0'
          cache: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Build pinned host from its independent repository
        run: make setup
      - name: Verify A2A discovery, authorisation and durable retry without provider credentials
        timeout-minutes: 3
        run: make a2a
      - name: Verify interoperability with the pinned official A2A Python SDK
        timeout-minutes: 4
        run: |
          python3 -m venv .tools/a2a-sdk
          .tools/a2a-sdk/bin/python -m pip install -r examples/a2a-review/requirements-sdk.txt
          .tools/a2a-sdk/bin/python examples/a2a-review/sdk_check.py --report .state/a2a-review/official-sdk.json
      - name: Retain A2A fixture evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nehemiah-a2a-fixture
          path: .state/a2a-review
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/k3s-live/package-lock.json
      - name: Verify mixed-agent protocol and assessment conformance through the pinned host
        working-directory: examples/k3s-live
        env:
          MAS_HOST_BIN: ${{ github.workspace }}/.tools/mas-host/target/debug/mas-host
          MAS_SDK_ROOT: ${{ github.workspace }}/.tools/mas-host
        run: |
          npm ci --ignore-scripts
          npm run build
          npm run test:host

  incident:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.24.0'
          cache: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Build pinned host from its independent repository
        run: make setup
      - name: Check frozen incident experiment and run the credential-free rehearsal
        run: |
          python3 -m unittest discover -s experiments/incident-revision -p 'test_*.py'
          python3 experiments/incident-revision/run.py freeze --out .state/incident-pilot --host .tools/mas-host/target/debug/mas-host --sdk .tools/mas-host --mode fixture
          python3 experiments/incident-revision/run.py run --out .state/incident-pilot
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          result = json.loads(Path('.state/incident-pilot/results.json').read_text())
          assert result['mode'] == 'fixture' and result['status'] == 'fixture-rehearsal', 'Expected fixture rehearsal'
          assert result['promotion'] is False, 'Fixture cannot establish empirical promotion'
          assert result['failure_override'] is False and result['missing_or_failed_runs'] == 0, 'Fixture has failed or missing arms'
          expected_calls = {'one_pass': 36, 'revision': 144, 'resample': 144}
          assert set(result['by_arm']) == set(expected_calls), 'Unexpected experiment arms'
          for arm, calls in expected_calls.items():
              observed = result['by_arm'][arm]
              assert observed['runs'] == 36, f'{arm}: incomplete repeated trials'
              assert observed['missing_output'] == 0, f'{arm}: missing output'
              assert observed['provider_calls'] == calls, f'{arm}: expected provider effects were not exercised'
          assert result['incident_count'] == 12 and result['independent_families'] == 6, 'Incomplete incident coverage'
          print('Verified 108 complete fixture arms and 324 provider effects.')
          PYTHON
      - name: Retain incident rehearsal evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: incident-revision-rehearsal
          path: .state/incident-pilot
          if-no-files-found: warn
          retention-days: 14

  # Preserve the existing required check and reject failed, skipped or cancelled groups.
  linux:
    if: ${{ always() }}
    needs: [applications, conformance, incident]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every test group to succeed
        env:
          APPLICATIONS_RESULT: ${{ needs.applications.result }}
          CONFORMANCE_RESULT: ${{ needs.conformance.result }}
          INCIDENT_RESULT: ${{ needs.incident.result }}
        run: |
          test "$APPLICATIONS_RESULT" = success
          test "$CONFORMANCE_RESULT" = success
          test "$INCIDENT_RESULT" = success
