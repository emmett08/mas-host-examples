name: Bounded source self-remediation

on:
  pull_request:
    paths: ['examples/self-remediation/**', '.github/workflows/self-remediation.yml', '.github/actions/self-remediation-integration/**', 'host-revision.txt']
  push:
    branches: [main]
    paths: ['examples/self-remediation/**', '.github/workflows/self-remediation.yml', '.github/actions/self-remediation-integration/**', 'host-revision.txt']
  workflow_dispatch:
    inputs:
      live_provider:
        description: 'Use a billed provider after all credential-free checks pass'
        type: boolean
        default: false
      case:
        description: 'One bounded case per workflow; no expenditure-multiplying matrix'
        type: choice
        default: missing-route
        options: [missing-route, business-logic, runtime-config, held-out-combination, unavailable-dependency, ambiguous-requirement, no-defect, verification-bypass]
      publication:
        description: 'Publish only into the explicitly scoped disposable demonstration branch'
        type: choice
        default: archive
        options: [archive, pull-request, automatic]

permissions:
  contents: read

# A push to demo/incidents/** or a repair branch cannot trigger this workflow.
# A repair PR targets demo/incidents/** and cannot obtain live credentials.
concurrency:
  group: self-remediation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24.19.0'
  # One live incident owns the persistent workflow call/candidate/spend account.
  # Its repair window is 600s; fixed infrastructure job timeouts sum to 95min.
  # Fixture controls and publication/promotion make no additional provider calls.
  SELF_REMEDIATION_MAX_CALLS: '12'
  SELF_REMEDIATION_MAX_CANDIDATES: '3'
  SELF_REMEDIATION_MAX_SECONDS: '600'
  SELF_REMEDIATION_MAX_USD: '2.00'

jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: examples/self-remediation/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.24.0'
          cache: false
      - name: Install formal checker and exact host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y spin
          rustup toolchain install 1.99.0 --profile minimal
      - name: Compile the pinned host, not host main
        run: make setup
      - name: Build the separate application and observer bundle
        working-directory: examples/self-remediation
        run: |
          npm ci --ignore-scripts
          npm run build
          npm test
      - name: Make the built local observer available before the live job starts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: self-remediation-observer-${{ github.run_id }}-${{ github.run_attempt }}
          path: examples/self-remediation/dist/observer
          if-no-files-found: error
          retention-days: 14
      - name: Compile host topology and exercise native and custom MCP contracts
        working-directory: examples/self-remediation
        env:
          MAS_HOST_BIN: ${{ github.workspace }}/.tools/mas-host/target/debug/mas-host
          MAS_SDK_ROOT: ${{ github.workspace }}/.tools/mas-host
        run: npm run test:host
      - name: Verify during-run browser updates, mobile layout and offline seeking
        working-directory: examples/self-remediation
        env:
          SELF_REMEDIATION_BROWSER_TEST: '1'
        run: |
          npx playwright install --with-deps chromium
          node --import tsx --test tests/observer-browser.test.ts
      - name: Exhaust finite controller invariants and guard-removal controls
        run: python3 examples/self-remediation/verification/verify.py --out "$RUNNER_TEMP/self-remediation-formal"
      - name: Build the credential-free candidate execution image
        run: |
          docker build -t mas-self-remediation-builder examples/self-remediation/sandbox
          echo "MAS_SANDBOX_IMAGE=$(docker image inspect --format '{{.Id}}' mas-self-remediation-builder)" >> "$GITHUB_ENV"
      - name: Create isolated runner-local k3s
        run: bash examples/self-remediation/scripts/prepare-k3s.sh
      - name: Real host, generated fixture patch, independent checks and k3s trial
        uses: ./.github/actions/self-remediation-integration
        with:
          mode: fixture
          case: missing-route
          output: ${{ runner.temp }}/self-remediation-fixture
        env:
          MAS_HOST_BIN: ${{ github.workspace }}/.tools/mas-host/target/debug/mas-host
          MAS_SDK_ROOT: ${{ github.workspace }}/.tools/mas-host
      - name: Retain all diagnostics, immutable checkpoints and offline observer
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: self-remediation-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/self-remediation-fixture
            ${{ runner.temp }}/self-remediation-formal
          if-no-files-found: warn
          retention-days: 14
      - name: Retain desktop and mobile browser control evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: self-remediation-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/self-remediation-observer-*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve cluster observations and remove disposable cluster
        if: always()
        run: |
          kubectl get pods,events --all-namespaces -o wide || true
          k3d cluster delete self-remediation || true

  live:
    if: github.event_name == 'workflow_dispatch' && inputs.live_provider && github.ref == 'refs/heads/main'
    needs: fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: self-remediation-live
    outputs:
      has-candidate: ${{ steps.selection.outputs.has-candidate }}
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: examples/self-remediation/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.24.0'
          cache: false
      - name: Build trusted main code and pinned host before supplying credentials
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          make setup
          npm ci --ignore-scripts --prefix examples/self-remediation
          npm run build --prefix examples/self-remediation
          docker build -t mas-self-remediation-builder examples/self-remediation/sandbox
          echo "MAS_SANDBOX_IMAGE=$(docker image inspect --format '{{.Id}}' mas-self-remediation-builder)" >> "$GITHUB_ENV"
      - name: Create isolated runner-local k3s
        run: bash examples/self-remediation/scripts/prepare-k3s.sh
      - name: Run selected live case and publish redacted progress during execution
        uses: ./.github/actions/self-remediation-integration
        with:
          mode: live
          case: ${{ inputs.case }}
          output: ${{ runner.temp }}/self-remediation-live
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          SELF_REMEDIATION_GITHUB_READ_TOKEN: ${{ secrets.SELF_REMEDIATION_GITHUB_READ_TOKEN }}
          SELF_REMEDIATION_GITHUB_MCP_SCHEMA_SHA256: ${{ vars.SELF_REMEDIATION_GITHUB_MCP_SCHEMA_SHA256 }}
          SELF_REMEDIATION_MODEL: ${{ vars.SELF_REMEDIATION_MODEL }}
          # Reserved upper bound per admitted model call, not a reported provider charge.
          SELF_REMEDIATION_MAX_CALL_MICRO_USD: ${{ vars.SELF_REMEDIATION_MAX_CALL_MICRO_USD || '150000' }}
          SELF_REMEDIATION_PUBLICATION_MODE: ${{ inputs.publication }}
          SELF_REMEDIATION_CASE: ${{ inputs.case }}
          SELF_REMEDIATION_PROGRESS: 'true'
          MAS_HOST_BIN: ${{ github.workspace }}/.tools/mas-host/target/debug/mas-host
          MAS_SDK_ROOT: ${{ github.workspace }}/.tools/mas-host
      - name: Select publication only when a verified candidate was retained
        id: selection
        run: |
          if [[ -f "$RUNNER_TEMP/self-remediation-live/publication-manifest.json" ]]; then
            echo 'has-candidate=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has-candidate=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Retain live evidence and publication manifest even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: self-remediation-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/self-remediation-live
          retention-days: 14
          if-no-files-found: warn
      - name: Capture observations before destroying the trial
        if: always()
        run: |
          kubectl get pods,events --all-namespaces -o wide || true
          k3d cluster delete self-remediation || true

  publication:
    if: github.event_name == 'workflow_dispatch' && inputs.live_provider && inputs.publication != 'archive' && github.ref == 'refs/heads/main' && needs.live.outputs.has-candidate == 'true'
    needs: live
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: self-remediation-publication
    outputs:
      status: ${{ steps.publish.outputs.status }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out exact trusted controller source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.24.0'
          cache: false
      - name: Build pinned host for admitted publication invocation identities
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          make setup
      - name: Compile trusted publisher without running candidate code
        working-directory: examples/self-remediation
        run: |
          npm ci --ignore-scripts
          npm run build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: self-remediation-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/retained-live
          digest-mismatch: error
      - name: Issue a repository-scoped GitHub App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SELF_REMEDIATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.SELF_REMEDIATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read
      - name: Publish retained candidate using independently configured policy
        id: publish
        working-directory: examples/self-remediation
        env:
          SELF_REMEDIATION_PUBLISH_TOKEN: ${{ steps.app.outputs.token }}
          SELF_REMEDIATION_PUBLICATION: ${{ inputs.publication }}
          SELF_REMEDIATION_REQUIRED_CHECKS: ${{ vars.SELF_REMEDIATION_REQUIRED_CHECKS }}
          MAS_HOST_BIN: ${{ github.workspace }}/.tools/mas-host/target/debug/mas-host
          MAS_SDK_ROOT: ${{ github.workspace }}/.tools/mas-host
        run: node --import tsx scripts/publish-retained.ts --input "$RUNNER_TEMP/retained-live" --output "$RUNNER_TEMP/self-remediation-publication"
      - name: Combine controller and publication evidence into the offline Vue archive
        if: always()
        working-directory: examples/self-remediation
        run: |
          if [[ -f "$RUNNER_TEMP/self-remediation-publication/journal/events.jsonl" ]]; then
            node --import tsx scripts/combine-replay.ts --controller "$RUNNER_TEMP/retained-live" --publication "$RUNNER_TEMP/self-remediation-publication" --output "$RUNNER_TEMP/self-remediation-publication/archive"
          fi
      - name: Retain publication receipts and unknown-effect checkpoints
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: self-remediation-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/self-remediation-publication
          retention-days: 14
          if-no-files-found: warn

  promotion:
    if: github.event_name == 'workflow_dispatch' && inputs.live_provider && inputs.publication == 'automatic' && github.ref == 'refs/heads/main' && needs.publication.outputs.status == 'merged'
    needs: [live, publication]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # This job has no provider key, GitHub App private key or publication token.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.24.0'
          cache: false
      - name: Build trusted verification tools and pinned host
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          make setup
          npm ci --ignore-scripts --prefix examples/self-remediation
          npm run build --prefix examples/self-remediation
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: self-remediation-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/promotion-live
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: self-remediation-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/promotion-publication
          digest-mismatch: error
      - name: Create a fresh disposable promotion target
        run: bash examples/self-remediation/scripts/prepare-k3s.sh
      - name: Require unchanged merged tree, retained image and fresh protected observations
        working-directory: examples/self-remediation
        env:
          MAS_HOST_BIN: ${{ github.workspace }}/.tools/mas-host/target/debug/mas-host
          MAS_SDK_ROOT: ${{ github.workspace }}/.tools/mas-host
        run: node --import tsx scripts/promote-retained.ts --input "$RUNNER_TEMP/promotion-live" --publication "$RUNNER_TEMP/promotion-publication" --output "$RUNNER_TEMP/self-remediation-promotion"
      - name: Combine all completed scopes into the offline Vue archive
        if: always()
        working-directory: examples/self-remediation
        run: |
          if [[ -f "$RUNNER_TEMP/self-remediation-promotion/journal/events.jsonl" ]]; then
            node --import tsx scripts/combine-replay.ts --controller "$RUNNER_TEMP/promotion-live" --publication "$RUNNER_TEMP/promotion-publication" --promotion "$RUNNER_TEMP/self-remediation-promotion" --output "$RUNNER_TEMP/self-remediation-promotion/archive"
          fi
      - name: Retain fresh promotion observations and unresolved-effect evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: self-remediation-promotion-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/self-remediation-promotion
          retention-days: 14
          if-no-files-found: warn
      - name: Capture observations and remove the disposable promotion cluster
        if: always()
        run: |
          kubectl get pods,events --all-namespaces -o wide || true
          k3d cluster delete self-remediation || true
