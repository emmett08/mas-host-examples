name: Self-healing case

on:
  workflow_call:
    inputs:
      case:
        type: string
        required: true
      live_provider:
        type: boolean
        default: false
      publication:
        type: string
        default: archive
      host_artifact_id:
        type: string
        required: true
      host_sha256:
        type: string
        required: true
    # Required mappings allow environment-scoped secrets to resolve in their
    # protected jobs. Empty values remain valid for credential-free fixtures;
    # live preflight validates the credentials actually needed by that mode.
    secrets:
      OPENAI_API_KEY:
        description: Provider credential resolved in self-remediation-live
        required: true
      SELF_REMEDIATION_GITHUB_READ_TOKEN:
        description: Optional MCP read credential resolved in self-remediation-live
        required: true
      SELF_REMEDIATION_APP_PRIVATE_KEY:
        description: Publication credential resolved in self-remediation-publication
        required: true

permissions:
  contents: read

env:
  NODE_VERSION: '24.19.0'
  MAS_HOST_BIN: ${{ github.workspace }}/.tools/mas-host/target/release/mas-host
  MAS_SDK_ROOT: ${{ github.workspace }}/.tools/mas-host
  SELF_REMEDIATION_MAX_CALLS: '12'
  SELF_REMEDIATION_MAX_CANDIDATES: '3'
  SELF_REMEDIATION_MAX_SECONDS: '600'
  SELF_REMEDIATION_MAX_USD: '2.00'
  SELF_REMEDIATION_CASE: ${{ inputs.case }}
  SELF_REMEDIATION_OBSERVER_CASE: ${{ inputs.case }}
  SELF_REMEDIATION_OBSERVER_LIVE: ${{ inputs.live_provider }}
  SELF_REMEDIATION_MATRIX_CASE: ${{ inputs.case }}

jobs:
  fixture:
    if: ${{ !inputs.live_provider }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: examples/self-healing/package-lock.json
      - uses: ./.github/actions/prepared-mas-host
        with:
          artifact-id: ${{ inputs.host_artifact_id }}
          sha256: ${{ inputs.host_sha256 }}
      - name: Build case tools and observer
        run: |
          npm ci --ignore-scripts --prefix examples/self-healing
          npm run build --prefix examples/self-healing
          docker build -t mas-self-remediation-builder examples/self-healing/sandbox
          echo "MAS_SANDBOX_IMAGE=$(docker image inspect --format '{{.Id}}' mas-self-remediation-builder)" >> "$GITHUB_ENV"
      - name: Retain the observer for this fixture case
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: self-remediation-observer-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.case }}
          path: examples/self-healing/dist/observer
          if-no-files-found: error
          retention-days: 14
      - name: Create isolated runner-local k3s
        run: bash examples/self-healing/scripts/prepare-k3s.sh
      - name: Exercise the selected credential-free case
        uses: ./.github/actions/self-healing-integration
        with:
          mode: fixture
          case: ${{ inputs.case }}
          output: ${{ runner.temp }}/self-remediation-fixture
      - name: Retain case evidence and offline replay
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: self-remediation-fixture-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.case }}
          path: |
            ${{ runner.temp }}/self-remediation-fixture
            !${{ runner.temp }}/self-remediation-fixture/durable-checkpoints/**
          retention-days: 14
          if-no-files-found: warn
      - name: Preserve observations and remove disposable cluster
        if: always()
        run: |
          kubectl get pods,events --all-namespaces -o wide || true
          k3d cluster delete self-remediation || true

  live:
    if: inputs.live_provider && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: self-remediation-live
    outputs:
      has-candidate: ${{ steps.selection.outputs.has-candidate }}
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: examples/self-healing/package-lock.json
      - name: Validate live settings before building infrastructure
        working-directory: examples/self-healing
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          SELF_REMEDIATION_GITHUB_READ_TOKEN: ${{ secrets.SELF_REMEDIATION_GITHUB_READ_TOKEN }}
          SELF_REMEDIATION_GITHUB_MCP_SCHEMA_SHA256: ${{ vars.SELF_REMEDIATION_GITHUB_MCP_SCHEMA_SHA256 }}
          SELF_REMEDIATION_MODEL: ${{ vars.SELF_REMEDIATION_MODEL }}
          SELF_REMEDIATION_MAX_CALL_MICRO_USD: ${{ vars.SELF_REMEDIATION_MAX_CALL_MICRO_USD || '150000' }}
          SELF_REMEDIATION_PROGRESS: 'true'
        run: node scripts/preflight.mjs --mode live --output "$RUNNER_TEMP/self-remediation-live/live-preflight.json"
      - uses: ./.github/actions/prepared-mas-host
        with:
          artifact-id: ${{ inputs.host_artifact_id }}
          sha256: ${{ inputs.host_sha256 }}
      - name: Build trusted case tools and observer before supplying credentials
        run: |
          npm ci --ignore-scripts --prefix examples/self-healing
          npm run build --prefix examples/self-healing
          docker build -t mas-self-remediation-builder examples/self-healing/sandbox
          echo "MAS_SANDBOX_IMAGE=$(docker image inspect --format '{{.Id}}' mas-self-remediation-builder)" >> "$GITHUB_ENV"
      - name: Retain the observer for this case before live execution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: self-remediation-observer-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.case }}
          path: examples/self-healing/dist/observer
          if-no-files-found: error
          retention-days: 14
      - name: Create isolated runner-local k3s
        run: bash examples/self-healing/scripts/prepare-k3s.sh
      - name: Run selected live case and publish redacted progress during execution
        uses: ./.github/actions/self-healing-integration
        with:
          mode: live
          case: ${{ inputs.case }}
          output: ${{ runner.temp }}/self-remediation-live
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          SELF_REMEDIATION_GITHUB_READ_TOKEN: ${{ secrets.SELF_REMEDIATION_GITHUB_READ_TOKEN }}
          SELF_REMEDIATION_GITHUB_MCP_SCHEMA_SHA256: ${{ vars.SELF_REMEDIATION_GITHUB_MCP_SCHEMA_SHA256 }}
          SELF_REMEDIATION_MODEL: ${{ vars.SELF_REMEDIATION_MODEL }}
          # Reserved upper bound per admitted model call, not a reported provider charge.
          SELF_REMEDIATION_MAX_CALL_MICRO_USD: ${{ vars.SELF_REMEDIATION_MAX_CALL_MICRO_USD || '150000' }}
          SELF_REMEDIATION_PUBLICATION_MODE: ${{ inputs.publication }}
          SELF_REMEDIATION_CASE: ${{ inputs.case }}
          SELF_REMEDIATION_PROGRESS: 'true'
          MAS_HOST_BIN: ${{ github.workspace }}/.tools/mas-host/target/release/mas-host
          MAS_SDK_ROOT: ${{ github.workspace }}/.tools/mas-host
      - name: Select publication only when a verified candidate was retained
        id: selection
        run: |
          if [[ -f "$RUNNER_TEMP/self-remediation-live/publication-manifest.json" ]]; then
            echo 'has-candidate=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has-candidate=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Retain live evidence and publication manifest even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: self-remediation-live-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.case }}
          # Immutable checkpoints already have separately acknowledged artifacts.
          # Retain their index/receipts here, without reuploading every local cut.
          path: |
            ${{ runner.temp }}/self-remediation-live
            !${{ runner.temp }}/self-remediation-live/durable-checkpoints/**
          retention-days: 14
          if-no-files-found: warn
      - name: Capture observations before destroying the trial
        if: always()
        run: |
          kubectl get pods,events --all-namespaces -o wide || true
          k3d cluster delete self-remediation || true

  publication:
    if: inputs.live_provider && github.event_name == 'workflow_dispatch' && inputs.publication != 'archive' && github.ref == 'refs/heads/main' && needs.live.outputs.has-candidate == 'true'
    needs: live
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: self-remediation-publication
    outputs:
      status: ${{ steps.publish.outputs.status }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out exact trusted controller source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: ./.github/actions/prepared-mas-host
        with:
          artifact-id: ${{ inputs.host_artifact_id }}
          sha256: ${{ inputs.host_sha256 }}
      - name: Compile trusted publisher without running candidate code
        working-directory: examples/self-healing
        run: |
          npm ci --ignore-scripts
          npm run build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: self-remediation-live-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.case }}
          path: ${{ runner.temp }}/retained-live
          digest-mismatch: error
      - name: Issue a repository-scoped GitHub App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SELF_REMEDIATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.SELF_REMEDIATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read
      - name: Publish retained candidate using independently configured policy
        id: publish
        working-directory: examples/self-healing
        env:
          SELF_REMEDIATION_PUBLISH_TOKEN: ${{ steps.app.outputs.token }}
          SELF_REMEDIATION_PUBLICATION: ${{ inputs.publication }}
          SELF_REMEDIATION_REQUIRED_CHECKS: ${{ vars.SELF_REMEDIATION_REQUIRED_CHECKS }}
          MAS_HOST_BIN: ${{ github.workspace }}/.tools/mas-host/target/release/mas-host
          MAS_SDK_ROOT: ${{ github.workspace }}/.tools/mas-host
        run: node --import tsx scripts/publish-retained.ts --input "$RUNNER_TEMP/retained-live" --output "$RUNNER_TEMP/self-remediation-publication"
      - name: Combine controller and publication evidence into the offline Vue archive
        if: always()
        working-directory: examples/self-healing
        run: |
          if [[ -f "$RUNNER_TEMP/self-remediation-publication/journal/events.jsonl" ]]; then
            node --import tsx scripts/combine-replay.ts --controller "$RUNNER_TEMP/retained-live" --publication "$RUNNER_TEMP/self-remediation-publication" --output "$RUNNER_TEMP/self-remediation-publication/archive"
          fi
      - name: Retain publication receipts and unknown-effect checkpoints
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: self-remediation-publication-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.case }}
          path: ${{ runner.temp }}/self-remediation-publication
          retention-days: 14
          if-no-files-found: warn

  promotion:
    if: inputs.live_provider && github.event_name == 'workflow_dispatch' && inputs.publication == 'automatic' && github.ref == 'refs/heads/main' && needs.publication.outputs.status == 'merged'
    needs: [live, publication]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # This job has no provider key, GitHub App private key or publication token.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: ./.github/actions/prepared-mas-host
        with:
          artifact-id: ${{ inputs.host_artifact_id }}
          sha256: ${{ inputs.host_sha256 }}
      - name: Build trusted verification tools
        run: |
          npm ci --ignore-scripts --prefix examples/self-healing
          npm run build --prefix examples/self-healing
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: self-remediation-live-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.case }}
          path: ${{ runner.temp }}/promotion-live
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: self-remediation-publication-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.case }}
          path: ${{ runner.temp }}/promotion-publication
          digest-mismatch: error
      - name: Create a fresh disposable promotion target
        run: bash examples/self-healing/scripts/prepare-k3s.sh
      - name: Require unchanged merged tree, retained image and fresh protected observations
        working-directory: examples/self-healing
        env:
          MAS_HOST_BIN: ${{ github.workspace }}/.tools/mas-host/target/release/mas-host
          MAS_SDK_ROOT: ${{ github.workspace }}/.tools/mas-host
        run: node --import tsx scripts/promote-retained.ts --input "$RUNNER_TEMP/promotion-live" --publication "$RUNNER_TEMP/promotion-publication" --output "$RUNNER_TEMP/self-remediation-promotion"
      - name: Combine all completed scopes into the offline Vue archive
        if: always()
        working-directory: examples/self-healing
        run: |
          if [[ -f "$RUNNER_TEMP/self-remediation-promotion/journal/events.jsonl" ]]; then
            node --import tsx scripts/combine-replay.ts --controller "$RUNNER_TEMP/promotion-live" --publication "$RUNNER_TEMP/promotion-publication" --promotion "$RUNNER_TEMP/self-remediation-promotion" --output "$RUNNER_TEMP/self-remediation-promotion/archive"
          fi
      - name: Retain fresh promotion observations and unresolved-effect evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: self-remediation-promotion-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.case }}
          path: ${{ runner.temp }}/self-remediation-promotion
          retention-days: 14
          if-no-files-found: warn
      - name: Capture observations and remove the disposable promotion cluster
        if: always()
        run: |
          kubectl get pods,events --all-namespaces -o wide || true
          k3d cluster delete self-remediation || true
