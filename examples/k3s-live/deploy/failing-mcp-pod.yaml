apiVersion: apps/v1
kind: Deployment
metadata:
  name: mas-demo-checkout-mcp
  namespace: mas-demo
  labels:
    app.kubernetes.io/name: mas-demo-checkout-mcp
    demo.mas.dev/managed: 'true'
    demo.mas.dev/trigger: 'false'
    demo.mas.dev/approach: mcp
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: mas-demo-checkout-mcp}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mas-demo-checkout-mcp
        demo.mas.dev/managed: 'true'
        demo.mas.dev/trigger: 'false'
        demo.mas.dev/approach: mcp
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 5
      containers:
        - name: checkout
          image: mas-k3s-live:demo
          imagePullPolicy: IfNotPresent
          command: [node, /app/deploy/probe-app.mjs]
          ports: [{name: http, containerPort: 8081}]
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 1
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 2
            periodSeconds: 3
          resources:
            requests: {cpu: 5m, memory: 32Mi}
            limits: {cpu: 100m, memory: 96Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: mas-demo-checkout-mcp
  namespace: mas-demo
  labels: {demo.mas.dev/managed: 'true'}
spec:
  selector: {app.kubernetes.io/name: mas-demo-checkout-mcp}
  ports: [{name: http, port: 8081, targetPort: http}]
