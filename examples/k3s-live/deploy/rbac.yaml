apiVersion: v1
kind: ServiceAccount
metadata:
  name: mas-demo-operator
  namespace: mas-demo
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mas-demo-operator
  namespace: mas-demo
rules:
  - apiGroups: ['']
    resources: [events, pods]
    verbs: [get, list]
  - apiGroups: ['']
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get]
  - apiGroups: [demo.mas.dev]
    resources: [masdemoruns]
    verbs: [get, list, create]
  - apiGroups: [demo.mas.dev]
    resources: [masdemoruns/status]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mas-demo-operator
  namespace: mas-demo
subjects:
  - kind: ServiceAccount
    name: mas-demo-operator
    namespace: mas-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mas-demo-operator
