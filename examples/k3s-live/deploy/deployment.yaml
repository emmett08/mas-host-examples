apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mas-demo-state
  namespace: mas-demo
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mas-demo
  namespace: mas-demo
spec:
  replicas: 1
  # Retained IDs and host state belong to one backend; a second replica is not
  # an HA mode. Recreate also avoids concurrent mounts of the local-path PVC.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mas-demo
  template:
    metadata:
      annotations:
        demo.mas.dev/show-payloads: 'false'
      labels:
        app.kubernetes.io/name: mas-demo
    spec:
      serviceAccountName: mas-demo-operator
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: dashboard
          image: mas-k3s-live:demo
          imagePullPolicy: IfNotPresent
          command: [node, dist/server/index.js]
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: PORT, value: '8080'}
            - {name: LISTEN_HOST, value: 0.0.0.0}
            - {name: DEMO_DATA_DIR, value: /data}
            - {name: MAS_HOST_BIN, value: /opt/mas-host/mas-host}
            - {name: MAS_SDK_ROOT, value: /opt/mas-host}
            - name: DEMO_MODE
              valueFrom:
                configMapKeyRef: {name: mas-demo-settings, key: provider}
            - name: SHOW_PAYLOADS
              valueFrom:
                configMapKeyRef: {name: mas-demo-settings, key: showPayloads, optional: true}
            - name: DEMO_VERIFIER_TOKEN
              valueFrom:
                secretKeyRef: {name: mas-demo-verifier, key: DEMO_VERIFIER_TOKEN, optional: true}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef: {name: mas-demo-provider, key: OPENAI_API_KEY, optional: true}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 3
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '2', memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: state, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
        - name: operator
          image: mas-k3s-live:demo
          imagePullPolicy: IfNotPresent
          command: [node, dist/operator/index.js]
          env:
            - name: MAS_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
            - {name: MAS_DEMO_API_URL, value: 'http://127.0.0.1:8080'}
          resources:
            requests: {cpu: 20m, memory: 48Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: operator-token, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true}
      volumes:
        - name: state
          persistentVolumeClaim: {claimName: mas-demo-state}
        - name: tmp
          emptyDir: {}
        - name: operator-token
          projected:
            sources:
              - serviceAccountToken: {path: token, expirationSeconds: 3600}
              - configMap:
                  name: kube-root-ca.crt
                  items: [{key: ca.crt, path: ca.crt}]
---
apiVersion: v1
kind: Service
metadata:
  name: mas-demo
  namespace: mas-demo
spec:
  selector:
    app.kubernetes.io/name: mas-demo
  ports:
    - {name: http, port: 8080, targetPort: http}
