apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: masdemoruns.demo.mas.dev
spec:
  group: demo.mas.dev
  scope: Namespaced
  names:
    plural: masdemoruns
    singular: masdemorun
    kind: MASDemoRun
    shortNames: [masrun]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: Phase, type: string, jsonPath: .status.phase}
        - {name: Run, type: string, jsonPath: .status.runId}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [scenario]
              x-kubernetes-validations:
                - rule: self == oldSelf
                  message: Create a new MASDemoRun to change the admitted scenario or evidence.
              properties:
                scenario:
                  type: string
                  enum: [pod-crash]
                event:
                  type: object
                  required: [namespace, name, uid, reason, message, involvedObject]
                  properties:
                    namespace: {type: string, maxLength: 63}
                    name: {type: string, maxLength: 253}
                    uid: {type: string, minLength: 1, maxLength: 128}
                    reason: {type: string, maxLength: 128}
                    message: {type: string, maxLength: 2000}
                    involvedObject:
                      type: object
                      required: [kind, name, namespace, uid]
                      properties:
                        kind: {type: string, maxLength: 128}
                        name: {type: string, maxLength: 253}
                        namespace: {type: string, maxLength: 63}
                        uid: {type: string, maxLength: 128}
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Running, Succeeded, Failed]
                runId: {type: string, maxLength: 128}
                message: {type: string, maxLength: 1000}
