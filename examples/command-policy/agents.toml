version = "mas-agents/3"

[[agents]]
name = "policy_check"
operation = "check_policy/1"
input_schema = "schemas/input.json"
output_schema = "schemas/output.json"
working_directory = "."

[agents.implementation]
kind = "command"
executable = "tools/policy-check"
arguments = [
    { literal = "--service" },
    { input = "/service" },
    { literal = "--max-critical" },
    { literal = "0" },
    { literal = "--invocation-id" },
    { invocation_id = true },
]
stdin = "json"
stdout = "json-object"
success_exit_codes = [0]
timeout_seconds = 10
max_output_bytes = 8192

[limits]
wall_seconds = 60
max_calls = 1
max_messages = 8
max_bytes = 131072
mailbox_capacity = 4
